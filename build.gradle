plugins {
    id "java"
    id "maven-publish"
    id "net.fabricmc.fabric-loom" version "1.17.13" apply false
}

def supportedMinecraftTargets = [
        "26.1"  : [
                minecraftVersion: "26.1",
                fabricApiVersion: "0.145.1+26.1"
        ].asImmutable(),
        "26.1.1": [
                minecraftVersion: "26.1.1",
                fabricApiVersion: "0.145.4+26.1.1"
        ].asImmutable(),
        "26.1.2": [
                minecraftVersion: "26.1.2",
                fabricApiVersion: "0.155.2+26.1.2"
        ].asImmutable()
].asImmutable()

def minecraftTarget = providers.gradleProperty("minecraft_target")
        .orElse("26.1")
        .get()
def minecraftCoordinates = supportedMinecraftTargets[minecraftTarget]
if (minecraftCoordinates == null) {
    throw new GradleException(
            "Unsupported minecraft_target '${minecraftTarget}'. "
                    + "Supported targets: 26.1, 26.1.1, 26.1.2."
    )
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def fabricEnabled = providers.gradleProperty("enableFabric")
        .map { it.toBoolean() }
        .orElse(true)
        .get()

if (fabricEnabled) {
    apply plugin: "net.fabricmc.fabric-loom"

    loom {
        splitEnvironmentSourceSets()

        mods {
            mappywall {
                sourceSet sourceSets.main
                sourceSet sourceSets.client
            }
        }
    }
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

dependencies {
    implementation "com.google.code.gson:gson:2.13.2"
    testImplementation platform("org.junit:junit-bom:5.14.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    if (fabricEnabled) {
        minecraft "com.mojang:minecraft:${minecraftCoordinates.minecraftVersion}"
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${minecraftCoordinates.fabricApiVersion}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "fabricEnabled", fabricEnabled

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    if (!fabricEnabled) {
        exclude("fabric.mod.json")
    }
}

tasks.register("printFabricStatus") {
    group = "help"
    description = "Prints the current Fabric/Loom compilation target."
    doLast {
        println("Fabric build target: ${minecraftTarget}; Minecraft "
                + "${minecraftCoordinates.minecraftVersion}, official mappings, Loader "
                + "${project.loader_version}, Fabric API "
                + "${minecraftCoordinates.fabricApiVersion}.")
        println("Use -PenableFabric=false for core-only unit tests if client mappings or dependencies are temporarily unavailable.")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = project.java_version as int
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }

    withSourcesJar()
}

test {
    useJUnitPlatform()
}
